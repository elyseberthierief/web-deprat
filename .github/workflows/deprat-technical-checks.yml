name: Vérifier DEPRAT Core

on:
  push:
    branches:
      - "feature/deprat-core"
  pull_request:
    branches:
      - "feature/deprat-core"

jobs:
  product-technical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier la syntaxe PHP
        run: |
          php -l deprat-core/deprat-core.php
          php -l deprat-core/includes/product-technical-data.php
          php -l deprat-core/includes/product-shape.php
          php -l deprat-core/includes/icon-library.php
          php -l deprat-core/includes/pdf-icons.php
          php -l deprat-core/includes/category-tree-admin.php
          php -l deprat-core/includes/product-list-admin.php
          php -l deprat-core/includes/product-single-layout.php
          php -l deprat-core/includes/product-3d.php
          php -l deprat-core/includes/product-client-layout.php
          php -l deprat-core/includes/product-packaging.php
          php -l deprat-core/includes/product-quote-pricing.php
          php -l deprat-core/includes/catalogue-archives.php
          php -l deprat-core/includes/catalogue-sections.php
          php -l deprat-core/includes/home-hero.php
          php -l deprat-core/templates/catalogue-archive.php
          php -l deprat-core/includes/product-autosave.php
          php -l deprat-core/templates/product-technical-admin.php
          php -l deprat-core/templates/product-technical-front.php
      - name: Vérifier la sauvegarde et le rendu
        run: php tests/product-technical-test.php
      - name: Vérifier les 11 pictogrammes techniques du PDF
        run: php tests/pdf-icons-test.php
      - name: Vérifier la syntaxe JavaScript
        run: |
          node --check deprat-core/assets/js/product-technical-admin.js
          node --check deprat-core/assets/js/product-3d-front.js
          node --check deprat-core/assets/js/product-client-layout.js
          node --check deprat-core/assets/js/catalogue-archive.js
          node --check deprat-core/assets/js/catalogue-mega-menu.js
          node --check deprat-core/assets/js/icon-library.js
          node --check deprat-core/assets/js/category-tree-admin.js
          node --check deprat-core/assets/js/category-tree-preview.js
          node --check deprat-core/assets/js/product-list-admin.js
          node --check tests/product-list-admin-real-browser.js
          node --check deprat-core/assets/js/product-autosave-admin.js
          node --check deprat-core/assets/js/home-hero.js
          node --check deprat-core/assets/js/home-slide-admin.js
          node --check deprat-core/assets/js/home-slide-order-admin.js
          node --check deprat-core/assets/js/product-3d-contours.js
          node --check tests/product-admin-real-browser.js
          node tests/product-technical-browser-test.js

  wordpress-integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_ROOT_HOST: "%"
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptest"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - name: Préparer WordPress et WooCommerce
        run: |
          curl -fsSL --retry 3 https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o /tmp/wp-cli.phar
          mkdir -p /tmp/deprat-wp
          php /tmp/wp-cli.phar core download --locale=fr_FR --path=/tmp/deprat-wp
          php /tmp/wp-cli.phar config create --dbname=wordpress --dbuser=root --dbpass=test --dbhost=127.0.0.1:3306 --path=/tmp/deprat-wp
          php /tmp/wp-cli.phar core install --url=http://127.0.0.1:8099 --title=DEPRAT --admin_user=deprat-test --admin_password=deprat-test --admin_email=test@example.test --skip-email --path=/tmp/deprat-wp
          php /tmp/wp-cli.phar option update siteurl http://127.0.0.1:8099 --path=/tmp/deprat-wp
          php /tmp/wp-cli.phar option update home http://127.0.0.1:8099 --path=/tmp/deprat-wp
          php /tmp/wp-cli.phar plugin install woocommerce --version=11.2.1 --activate --path=/tmp/deprat-wp
          php /tmp/wp-cli.phar theme install astra --activate --path=/tmp/deprat-wp
          cp -R deprat-core /tmp/deprat-wp/wp-content/plugins/deprat-core
          php /tmp/wp-cli.phar plugin activate deprat-core --path=/tmp/deprat-wp
      - name: Installer l’outil de test navigateur
        run: npm install --prefix "$RUNNER_TEMP/deprat-browser" --no-save --no-audit --no-fund playwright-core@1.62.1
      - name: Vérifier la fiche produit avec WooCommerce
        run: php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/tests/product-wordpress-integration.php" --path=/tmp/deprat-wp
      - name: Tester les slides d’accueil et le masquage
        run: php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/tests/home-hero-integration.php" --path=/tmp/deprat-wp
      - name: Tester les icônes et images des catégories WooCommerce
        run: php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/tests/category-visual-integration.php" --path=/tmp/deprat-wp
      - name: Vérifier les pages Astra et le téléchargement du PDF
        env:
          NODE_PATH: ${{ runner.temp }}/deprat-browser/node_modules
        run: bash tests/product-http-test.sh
      - name: Conserver l’aperçu de test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apercu-editeur-produit
          path: |
            ${{ runner.temp }}/deprat-editor-*.png
            ${{ runner.temp }}/deprat-fiche-client-*.png
            ${{ runner.temp }}/deprat-catalogue-*.png
            ${{ runner.temp }}/deprat-mega-menu.png
            ${{ runner.temp }}/deprat-arborescence-admin.png
            ${{ runner.temp }}/deprat-produits-admin-*.png
          if-no-files-found: ignore
          retention-days: 3
